name: build-push
on:
  push:
    branches: [ API-Brokerage ]
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  ECR_REPO: ${{ vars.ECR_REPO }}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Compute ECR variables
        shell: bash
        run: |
          REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          REGISTRY="${REGISTRY//$'\r'/}"
          echo "REGISTRY=$REGISTRY" >> $GITHUB_ENV
          echo "IMAGE=$REGISTRY/${ECR_REPO}" >> $GITHUB_ENV
      - run: aws ecr describe-repositories --repository-names "$ECR_REPO" || aws ecr create-repository --repository-name "$ECR_REPO"
      - run: aws ecr get-login-password | docker login --username AWS --password-stdin "$REGISTRY"
      - run: |
          docker build -t "$IMAGE:latest" .
          docker push "$IMAGE:latest"


